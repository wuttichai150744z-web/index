<!DOCTYPE html>
<html lang="th"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>มีเรื่องจะถามนะครับบบ 💌</title>
<link href="https://fonts.googleapis.com/css2?family=Mali:wght@400;600;700&family=Prompt:wght@400;600&display=swap" rel="stylesheet">
<style>
:root{--bg:#080519;--bg2:#2a1650;--card:rgba(40,20,78,.62);--ink:#ffe9f3;--pink:#e63c86;--soft:#d9a9cc;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%;height:100dvh;margin:0;overflow-x:hidden}
body{background:#080519;color:var(--ink);font-family:'Prompt',sans-serif;display:flex;justify-content:center;align-items:center}
body::before{content:'';position:fixed;inset:-30%;z-index:0;background:radial-gradient(ellipse at 20% 15%,#5b21b655,transparent 45%),radial-gradient(ellipse at 85% 85%,#be185d55,transparent 45%),radial-gradient(ellipse at 70% 20%,#1d4ed855,transparent 40%);animation:neb 40s linear infinite}
@keyframes neb{to{transform:rotate(360deg)}}
#sky{position:fixed;inset:0;width:100%;height:100%;z-index:1;pointer-events:none}
.opt,.box,.ticket,.btn.ghost{backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px)}
main{width:100%;max-width:420px;padding:18px;text-align:center;position:relative;z-index:2;max-height:100%;overflow-y:auto;overflow-x:hidden;-webkit-overflow-scrolling:touch}
.dots{display:flex;gap:6px;justify-content:center;margin-bottom:14px}
.dots i{width:8px;height:8px;border-radius:8px;background:var(--soft);opacity:.35;transition:all .5s cubic-bezier(.3,1.6,.5,1)}
.dots i.on{width:30px;background:var(--pink);opacity:1}
.pg{animation:in .6s cubic-bezier(.2,1.4,.4,1) both}
.pg.out{animation:outp .25s ease-in forwards}
@keyframes in{from{opacity:0;transform:translateX(60px) scale(.85) rotate(3deg)}}
@keyframes outp{to{opacity:0;transform:translateX(-60px) scale(.85) rotate(-3deg)}}
.mascot{display:inline-block;cursor:pointer;user-select:none;-webkit-user-select:none;font-size:0;line-height:1.1;animation:bob 2s ease-in-out infinite}
.mascot:active{animation:spin .6s}
@keyframes bob{0%,100%{transform:translateY(0) rotate(-4deg)}50%{transform:translateY(-14px) rotate(4deg) scale(1.08)}}
@keyframes spin{to{transform:rotate(360deg) scale(1.3)}}
h1{font-family:'Mali',cursive;font-size:34px;margin:6px 0 4px;animation:pop .7s .15s cubic-bezier(.3,1.8,.5,1) both}
@keyframes pop{from{opacity:0;transform:scale(.3)}}
p.sub{color:var(--soft);margin:0 0 18px;font-size:15px;animation:pop .6s .3s both}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.opt,select,.btn,.cd{font-family:inherit;color:var(--ink)}
.opt{background:var(--card);border:2px solid transparent;border-radius:20px;padding:16px 8px;font-size:15px;cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:6px;transition:transform .2s cubic-bezier(.3,1.8,.5,1),border-color .2s,box-shadow .2s;animation:pop .5s calc(.25s + var(--n)*.08s) cubic-bezier(.3,1.8,.5,1) both}
.opt span{font-size:34px;transition:transform .3s}
.opt:hover,.opt:focus-visible{border-color:var(--pink);transform:translateY(-5px) scale(1.06) rotate(-2deg);box-shadow:0 12px 24px #d6246e44;outline:none}
.opt:hover span{transform:scale(1.35) rotate(12deg)}
.opt:active{transform:scale(.9)}
.btn{border:0;border-radius:999px;padding:14px 28px;font-size:17px;font-weight:600;cursor:pointer;background:var(--pink);color:#fff;position:relative;overflow:hidden;transition:transform .2s cubic-bezier(.3,1.8,.5,1);animation:pop .6s .4s both}
.btn:not(.ghost){animation:pop .6s .4s both,pulse 1.8s 1s infinite}
@keyframes pulse{0%,100%{box-shadow:0 0 0 0 #d6246e88}50%{box-shadow:0 0 0 14px #d6246e00}}
.btn.ghost{background:var(--card);color:var(--ink)}
.btn:hover{transform:scale(1.1)}.btn:active{transform:scale(.92)}
.btn:focus-visible,select:focus-visible,.cd:focus-visible{outline:3px solid var(--pink);outline-offset:2px}
.row{display:flex;gap:12px;justify-content:center;flex-wrap:wrap;min-height:56px}
.back{margin-top:16px;background:none;border:2px solid var(--pink);color:var(--pink);border-radius:999px;padding:8px 20px;font-family:inherit;cursor:pointer;transition:.2s}
.back:hover{background:var(--pink);color:#fff;transform:translateX(-4px)}
.box{background:var(--card);border-radius:20px;padding:14px;margin-bottom:12px;animation:pop .5s .3s both}
.box label{display:block;color:var(--soft);font-size:13px;margin-bottom:8px}
.cal{display:grid;grid-template-columns:repeat(7,1fr);gap:4px}
.cal small{color:var(--soft);font-size:12px;padding:4px 0}
.cd{aspect-ratio:1;border:0;border-radius:50%;background:none;font-size:14px;cursor:pointer;transition:transform .2s cubic-bezier(.3,1.8,.5,1),background .2s;animation:pop .4s calc(var(--n)*.015s) both}
.cd:hover:not(:disabled){background:#d6246e33;transform:scale(1.25)}
.cd:disabled{opacity:.25;cursor:default}
.cd.sel{background:var(--pink);color:#fff;font-weight:600;transform:scale(1.15);animation:bounce .5s}
@keyframes bounce{40%{transform:scale(1.5)}}
.mh{display:flex;justify-content:space-between;align-items:center;font-family:'Mali',cursive;font-size:19px;margin-bottom:8px}
.mh button{background:var(--bg2);border:0;border-radius:50%;width:34px;height:34px;font-size:16px;cursor:pointer;color:var(--ink);transition:.2s}
.mh button:hover{background:var(--pink);color:#fff;transform:scale(1.15)}
.chips{display:flex;gap:8px;flex-wrap:wrap;justify-content:center}
.chip{border:2px solid var(--soft);background:none;color:var(--ink);border-radius:999px;padding:8px 14px;font-family:inherit;cursor:pointer;transition:.2s cubic-bezier(.3,1.8,.5,1)}
.chip:hover{transform:scale(1.12)}
.chip.sel{background:var(--pink);border-color:var(--pink);color:#fff;transform:scale(1.1)}
.ticket{background:var(--card);border:3px solid var(--pink);border-radius:24px;padding:18px;text-align:left;animation:flip .9s cubic-bezier(.2,1.3,.4,1) both;transform-origin:center}
@keyframes flip{from{opacity:0;transform:perspective(800px) rotateY(-90deg) scale(.7)}}
.ticket h1{text-align:center;font-size:28px}
.li{display:flex;justify-content:space-between;gap:10px;padding:9px 0;border-bottom:1px dashed var(--soft);font-size:15px;animation:slide .5s calc(.5s + var(--n)*.15s) both}
@keyframes slide{from{opacity:0;transform:translateX(40px)}}
.li b{font-weight:600;text-align:right}
.warn{text-align:center;font-family:'Mali',cursive;font-size:22px;margin:12px 0;animation:shake 2s 1.5s infinite;color:var(--pink)}
@keyframes shake{0%,90%,100%{transform:none}93%{transform:rotate(-6deg) scale(1.15)}96%{transform:rotate(6deg) scale(1.15)}}
.err{color:var(--pink);font-weight:600;min-height:24px;margin-bottom:6px}
.conf{position:fixed;z-index:9;pointer-events:none;width:10px;height:14px;top:0;left:0}
.spark{position:fixed;z-index:9;pointer-events:none;font-size:20px;animation:sp .8s ease-out forwards}
@keyframes sp{to{transform:translate(var(--x),var(--y)) scale(0) rotate(180deg);opacity:0}}

.bun{width:132px;height:132px;overflow:visible;filter:drop-shadow(0 6px 14px #0008)}
.mascot.sm .bun{width:100px;height:100px}
.bun .ear{transform-box:fill-box;transform-origin:50% 100%;animation:ear 2.4s ease-in-out infinite}
.bun .ear.r{animation-delay:.35s}
@keyframes ear{0%,100%{transform:rotate(-7deg)}50%{transform:rotate(9deg)}}
.bun .eye{transform-box:fill-box;transform-origin:center;animation:blink 4s infinite}
@keyframes blink{0%,93%,100%{transform:scaleY(1)}96%{transform:scaleY(.1)}}
.bun .arm{transform-box:fill-box;transform-origin:50% 0;animation:wave .7s ease-in-out infinite alternate}
.bun .arm.r{animation-delay:.35s}
@keyframes wave{from{transform:rotate(-14deg)}to{transform:rotate(20deg)}}
.bun .tear{animation:tear 1.1s ease-in infinite}
.bun .tear.b{animation-delay:.5s}
@keyframes tear{from{transform:translateY(0);opacity:1}to{transform:translateY(20px);opacity:0}}
.bun .spk,.bun .zz{animation:tw 1s ease-in-out infinite alternate;transform-box:fill-box;transform-origin:center}
@keyframes tw{from{transform:scale(.4) rotate(0);opacity:.4}to{transform:scale(1.2) rotate(45deg);opacity:1}}
.bun .hb{transform-box:fill-box;transform-origin:center;animation:hb .8s ease-in-out infinite}
@keyframes hb{50%{transform:scale(1.25)}}
.bun .chick{transform-box:fill-box;transform-origin:50% 100%;animation:hop .9s ease-in-out infinite}
@keyframes hop{50%{transform:translateY(-9px) rotate(8deg)}}
.bun .cheek{animation:flush 2s ease-in-out infinite alternate}
@keyframes flush{to{opacity:1}}

/* จอสัมผัส: ไม่ให้ hover ค้าง */
@media(hover:none){
  .opt:hover{transform:none;box-shadow:none;border-color:transparent}
  .opt:hover span{transform:none}
  .cd:hover:not(:disabled){background:none;transform:none}
  .chip:hover,.btn:hover,.back:hover{transform:none}
}
/* PC / แท็บเล็ต */
@media(min-width:768px){
  main{max-width:560px;padding:28px}
  h1{font-size:42px}
  p.sub{font-size:17px}
  .grid{gap:16px}
  .opt{font-size:16px;padding:22px 10px}
  .opt span{font-size:40px}
  .bun{width:160px;height:160px}
  .mascot.sm .bun{width:120px;height:120px}
  .cd{font-size:16px}
  .ticket h1{font-size:34px}
  .li{font-size:17px}
}
/* มือถือจอเล็ก / จอเตี้ย */
@media(max-width:360px),(max-height:640px){
  h1{font-size:26px}
  .bun{width:100px;height:100px}
  .mascot.sm .bun{width:76px;height:76px}
  .opt{padding:12px 6px}
  .opt span{font-size:28px}
  p.sub{margin-bottom:12px}
}
@media(prefers-reduced-motion:reduce){*{animation-duration:.01s!important;animation-iteration-count:1!important;animation-delay:0s!important;transition:none!important}}

/* ===== PRO EFFECTS ===== */
h1{line-height:1.55;padding:.08em .1em;overflow-wrap:anywhere;background:linear-gradient(90deg,#ff9ed0,#fff,#b9a6ff,#ffd1e8,#ff9ed0);background-size:300% 100%;-webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent;color:transparent;filter:drop-shadow(0 0 16px #e63c8699);animation:pop .7s .15s cubic-bezier(.3,1.8,.5,1) both,shine 5s linear infinite}
@keyframes shine{to{background-position:300% 0}}
.mascot{filter:drop-shadow(0 0 26px #ff6fae99)}
.opt{box-shadow:0 8px 30px #0006,inset 0 0 0 1px #ffffff1a,inset 0 1px 0 #ffffff33;background:linear-gradient(145deg,#4a2a8a66,#2a164e88);transform:perspective(600px) rotateX(var(--rx,0deg)) rotateY(var(--ry,0deg));position:relative;overflow:hidden}
.opt::before{content:'';position:absolute;inset:0;background:radial-gradient(circle at var(--mx,50%) var(--my,0%),#ffffff40,transparent 55%);opacity:0;transition:opacity .3s;pointer-events:none}
.opt:hover::before{opacity:1}
.opt:hover{transition:transform .08s linear,border-color .2s,box-shadow .2s}
.opt:hover,.opt:focus-visible{transform:perspective(600px) translateY(-6px) scale(1.07) rotateX(var(--rx,0deg)) rotateY(var(--ry,0deg));box-shadow:0 0 0 2px var(--pink),0 0 36px #e63c86aa,0 16px 34px #0008}
.btn:not(.ghost){background:linear-gradient(135deg,#ff6fae,#e63c86 50%,#b5179e);box-shadow:0 0 26px #e63c8699,inset 0 1px 0 #ffffff66}
.btn::after{content:'';position:absolute;top:0;left:-70%;width:40%;height:100%;background:linear-gradient(100deg,transparent,#fffa,transparent);transform:skewX(-20deg);animation:sw 2.8s 1s infinite;pointer-events:none}
@keyframes sw{to{left:140%}}
.rp{position:absolute;border-radius:50%;background:#fff7;transform:scale(0);animation:rp .65s ease-out forwards;pointer-events:none;width:40px;height:40px;margin:-20px 0 0 -20px}
@keyframes rp{to{transform:scale(7);opacity:0}}
.box{border:1px solid #ffffff22;box-shadow:0 10px 40px #0005,inset 0 1px 0 #ffffff22}
.ticket{position:relative;overflow:hidden;box-shadow:0 0 50px #e63c8677,inset 0 0 40px #e63c8625;border-image:none}
.ticket::after{content:'';position:absolute;inset:0;background:linear-gradient(115deg,transparent 30%,#ffffff2e 44%,#ff9ed040 50%,#9ed0ff40 56%,transparent 70%);background-size:260% 100%;animation:holo 3.5s linear infinite;pointer-events:none}
@keyframes holo{from{background-position:160% 0}to{background-position:-160% 0}}
.cd.sel{box-shadow:0 0 18px #e63c86}
.tr{position:fixed;z-index:9;pointer-events:none;font-size:13px;animation:tr .9s ease-out forwards}
@keyframes tr{to{transform:translate(var(--x),var(--y)) scale(0) rotate(90deg);opacity:0}}
.fh{position:fixed;bottom:-40px;z-index:1;pointer-events:none;opacity:.0;animation:fh var(--d) linear forwards}
@keyframes fh{0%{opacity:0;transform:translateY(0) translateX(0) scale(.6)}10%{opacity:.7}50%{transform:translateY(-55vh) translateX(var(--sw)) rotate(15deg) scale(1)}100%{opacity:0;transform:translateY(-115vh) translateX(calc(var(--sw)*-1)) rotate(-20deg) scale(.8)}}
.fw{position:fixed;z-index:9;pointer-events:none;animation:sp 1.1s ease-out forwards}
@media(prefers-reduced-motion:reduce){.fh,.tr{display:none}}
</style></head><body>
<main><div class="dots" id="dots"><i></i><i></i><i></i><i></i><i></i></div><div id="app"></div></main>
<script>
var S={step:0,what:null,part:null,date:null,t:''},V=new Date();V.setDate(1);
var WHAT=[['🎬','ดูหนัง'],['🍜','กินของอร่อย'],['☕','นั่งคาเฟ่ยาวๆ'],['🐠','ไปอควาเรียม'],['🎡','เดินตลาดนัด'],['🏠','อยู่บ้านเฉยๆ ก็ดี']];
var PART=[['🌅','เช้าเลย'],['⛅','บ่ายๆ'],['🌇','เย็นๆ'],['🌙','ค่ำไปเลย']];
var MON=['มกราคม','กุมภาพันธ์','มีนาคม','เมษายน','พฤษภาคม','มิถุนายน','กรกฎาคม','สิงหาคม','กันยายน','ตุลาคม','พฤศจิกายน','ธันวาคม'];
var DOW=['อา','จ','อ','พ','พฤ','ศ','ส'];
var TIMES={'เช้าเลย':['08:00','09:00','10:00','11:00'],'บ่ายๆ':['12:30','13:30','14:30','15:30'],'เย็นๆ':['16:30','17:30','18:30'],'ค่ำไปเลย':['19:00','20:00','21:00']};
var app=document.getElementById('app'),dots=document.getElementById('dots');
function $(i){return document.getElementById(i)}
function esc(s){return String(s).replace(/[&<>"]/g,function(c){return{'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]})}
var busy=false;
function go(n){if(busy)return;busy=true;var p=app.firstChild;function f(){S.step=n;busy=false;render()}if(p&&p.classList){p.classList.add('out');setTimeout(f,230)}else f()}
function opts(l,k){return '<div class="grid">'+l.map(function(o,i){return '<button class="opt" style="--n:'+i+'" data-k="'+k+'" data-i="'+i+'"><span>'+o[0]+'</span>'+o[1]+'</button>'}).join('')+'</div>'}
function bk(){return '<button class="back" id="back">← กลับ</button>'}
function fmt(d){return d.getDate()+' '+MON[d.getMonth()]+' '+d.getFullYear()}
function line(a,b,n){return '<div class="li" style="--n:'+n+'"><span>'+a+'</span><b>'+esc(b)+'</b></div>'}
function summary(){return '💌 ตอบรับนัดแล้วนะ\n'+WHAT[S.what][0]+' '+WHAT[S.what][1]+'\n📅 '+fmt(S.date)+' เวลา '+S.t+' น.\nห้ามเบี้ยว!'}
function cal(){
  var y=V.getFullYear(),m=V.getMonth(),f=new Date(y,m,1).getDay(),n=new Date(y,m+1,0).getDate(),t=new Date();t.setHours(0,0,0,0);
  var h='<div class="mh"><button id="pm">‹</button><span>'+MON[m]+' '+y+'</span><button id="nm">›</button></div><div class="cal">'+DOW.map(function(d){return '<small>'+d+'</small>'}).join('');
  for(var i=0;i<f;i++)h+='<span></span>';
  for(var d=1;d<=n;d++){var dt=new Date(y,m,d),sel=S.date&&+S.date===+dt;
    h+='<button class="cd'+(sel?' sel':'')+'" style="--n:'+d+'" data-d="'+d+'"'+(dt<t?' disabled':'')+'>'+d+'</button>'}
  return h+'</div>'}
function render(){
  var s=S.step,h='';
  [].forEach.call(dots.children,function(d,i){d.className=i===s?'on':''});
  dots.style.visibility=s>4?'hidden':'visible';
  if(s===0)h='<div class="mascot">🐰</div><h1>วันหยุดนี้ไปไหนดีน้าาาาา</h1><p class="sub">ถามตรงๆ เลย ไม่อ้อมแล้ว</p><div class="row"><button class="btn" id="yes">ไปด้วย ❤️</button><button class="btn ghost" id="no">ไม่ไปอะ 🥺</button></div>';
  if(s===1)h='<div class="mascot">🐰🐥</div><h1>อยากทำอะไรดี</h1><p class="sub">เลือกเลย เดี๋ยวจัดให้</p>'+opts(WHAT,'what')+bk();
  if(s===2)h='<div class="mascot">🐰</div><h1>กี่โมงดี</h1><p class="sub">บอกมาเลย เดี๋ยวไปรอ</p>'+opts(PART,'part')+bk();
  if(s===3)h='<div class="mascot" style="font-size:56px">📅</div><h1>เมื่อไหร่ดี?</h1><p class="sub">จิ้มวันที่ แล้วเลือกเวลา</p><div class="box" id="cal">'+cal()+'</div><div class="box"><label>เวลา</label><div class="chips">'+TIMES[PART[S.part][1]].map(function(t){return '<button class="chip'+(S.t===t?' sel':'')+'" data-t="'+t+'">'+t+' น.</button>'}).join('')+'</div></div><div class="err" id="err"></div><div class="row"><button class="btn" id="next">ต่อไป</button></div>'+bk();
  if(s===4)h='<div class="ticket"><div style="text-align:center"><span class="mascot">🐰💗</span></div><h1>นัดแล้วนะ</h1>'+line('อยากทำอะไร',WHAT[S.what][0]+' '+WHAT[S.what][1],0)+line('กี่โมงดี',PART[S.part][0]+' '+PART[S.part][1],1)+line('วันที่',fmt(S.date),2)+line('เวลา',S.t+' น.',3)+'<div class="warn">ห้ามเบี้ยว</div><div class="row"><button class="btn" id="send">ส่งคำตอบ</button></div></div><button class="back" id="edit">← แก้ไข</button>';
  if(s===5)h='<div class="mascot">🎉</div><h1>ส่งสำเร็จ!</h1><p class="sub">คัดลอกคำตอบแล้วส่งให้เขาได้เลย 💕</p><div class="box" style="text-align:left;white-space:pre-line">'+esc(summary())+'</div><div class="row"><button class="btn" id="copy">คัดลอกข้อความ</button><button class="btn ghost" id="again">เริ่มใหม่</button></div>';
  if(s===6)h='<div class="mascot">🥺</div><h1>ไม่เป็นไรนะ</h1><p class="sub">ไว้วันอื่นนะ ไว้ชวนใหม่ได้เสมอ</p><button class="btn ghost" id="again">กลับไปเปลี่ยนใจ</button>';
  app.innerHTML='<div class="pg">'+h+'</div>';document.querySelector('main').scrollTop=0;bind();
  fi=0;setBun();if(s===5){confetti();fireworks()}
}
function bind(){
  function on(i,f){var e=$(i);if(e)e.onclick=f}
  on('back',function(){go(S.step-1)});on('yes',function(){go(1)});on('no',function(){go(6)});
  on('edit',function(){go(3)});on('again',function(){S={step:0,what:null,part:null,date:null,t:''};go(0)});
  on('send',function(){go(5)});
  var no=$('no');
  if(no){
    var run=function(){no.style.transition='transform .25s';no.style.transform='translate('+((Math.random()-.5)*90)+'px,'+((Math.random()-.5)*90)+'px) rotate('+((Math.random()-.5)*40)+'deg)'};
    var dodge=function(e){if(!no.dataset.n||+no.dataset.n<3){no.dataset.n=(+no.dataset.n||0)+1;run();if(e&&e.cancelable)e.preventDefault()}};
    no.onmouseenter=dodge;
    no.addEventListener('touchstart',dodge,{passive:false});
  }
  [].forEach.call(document.querySelectorAll('.opt'),function(o){o.onclick=function(e){spark(e);var k=o.dataset.k;S[k]=+o.dataset.i;if(k==='part')S.t='';go(S.step+1)}});
  if($('cal')){
    function cb(){[].forEach.call(document.querySelectorAll('.cd'),function(c){c.onclick=function(e){spark(e);S.date=new Date(V.getFullYear(),V.getMonth(),+c.dataset.d);$('cal').innerHTML=cal();cb()}});
      $('pm').onclick=function(){var n=new Date();if(V.getFullYear()===n.getFullYear()&&V.getMonth()===n.getMonth())return;V.setMonth(V.getMonth()-1);$('cal').innerHTML=cal();cb()};$('nm').onclick=function(){V.setMonth(V.getMonth()+1);$('cal').innerHTML=cal();cb()}}
    cb();

function confetti(){var C=['#d6246e','#ffb703','#8ecae6','#ff8fab','#b5179e'],ps=[];

/* ---- space + heart constellation ---- */
var cv=document.createElement('canvas');cv.id='sky';document.body.insertBefore(cv,document.body.firstChild);
var cx=cv.getContext('2d'),W,H,D,ST=[],SH=[],N=300,K=110,CY=16,RM=matchMedia('(prefers-reduced-motion:reduce)').matches;
var COL=['255,255,255','255,214,236','190,210,255','230,200,255','255,240,200'];
function hp(t){return[16*Math.pow(Math.sin(t),3),-(13*Math.cos(t)-5*Math.cos(2*t)-2*Math.cos(3*t)-Math.cos(4*t))]}
function size(){D=Math.min(devicePixelRatio||1,2);W=innerWidth;H=innerHeight;cv.width=W*D;cv.height=H*D;cx.setTransform(D,0,0,D,0,0);
  var sc=Math.min(W*.92,H*.8)/34,ox=W/2,oy=H*.46;
  ST.forEach(function(a,i){var q;if(i<K){q=hp(i/K*6.2832);a.tx=ox+q[0]*sc;a.ty=oy+q[1]*sc}
    else{q=hp(a.u);var r=Math.sqrt(a.r);a.tx=ox+q[0]*sc*r;a.ty=oy+q[1]*sc*r}})}
for(var i=0;i<N;i++)ST.push({x:Math.random(),y:Math.random(),vx:(Math.random()-.5)*.012,vy:(Math.random()-.5)*.008,u:Math.random()*6.2832,r:Math.random(),z:Math.random(),ph:Math.random()*6.28,c:COL[i%5],d:Math.random()*.4});
addEventListener('resize',size);size();
function ease(x){return x<.5?4*x*x*x:1-Math.pow(-2*x+2,3)/2}
function mph(t){var c=t%CY;if(c<5)return 0;if(c<8.5)return(c-5)/3.5;if(c<12.5)return 1;if(c<15.5)return 1-(c-12.5)/3;return 0}
var SS=[],t0=performance.now();
function frame(now){
  var t=(now-t0)/1000*(RM?.3:1),m=mph(t),beat=1+.035*m*m*Math.pow(Math.sin(t*5),2);
  cx.clearRect(0,0,W,H);
  var cxm=W/2,cym=H*.46,P=[];
  for(var i=0;i<N;i++){var a=ST[i],ax=((a.x+a.vx*t)%1+1)%1*W,ay=((a.y+a.vy*t)%1+1)%1*H;
    var k=ease(Math.max(0,Math.min(1,(m-a.d*.5)/(1-a.d*.5)))),tx=cxm+(a.tx-cxm)*beat,ty=cym+(a.ty-cym)*beat;
    var x=ax+(tx-ax)*k,y=ay+(ty-ay)*k;P.push([x,y,k]);
    var tw=.55+.45*Math.sin(t*2+a.ph),rad=(.6+a.z*1.5)*(1+.6*k*(i<K?1:.3));
    cx.fillStyle='rgba('+a.c+','+(tw*(.5+.5*a.z)).toFixed(2)+')';cx.beginPath();cx.arc(x,y,rad,0,6.2832);cx.fill();
    if(a.z>.8||k>.9&&i<K){cx.fillStyle='rgba('+a.c+','+(.12*tw).toFixed(2)+')';cx.beginPath();cx.arc(x,y,rad*4,0,6.2832);cx.fill()}}
  if(m>.6){var al=(m-.6)/.4*.35;cx.strokeStyle='rgba(255,170,215,'+al.toFixed(2)+')';cx.lineWidth=1;cx.beginPath();
    for(i=0;i<=K;i++){var q=P[i%K];if(i)cx.lineTo(q[0],q[1]);else cx.moveTo(q[0],q[1])}cx.stroke()}
  if(!RM&&Math.random()<.008&&SS.length<2)SS.push({x:Math.random()*W,y:Math.random()*H*.4,vx:6+Math.random()*4,vy:3+Math.random()*2,l:1});
  SS=SS.filter(function(s){s.x+=s.vx;s.y+=s.vy;s.l-=.02;if(s.l<=0)return false;
    var g=cx.createLinearGradient(s.x,s.y,s.x-s.vx*9,s.y-s.vy*9);g.addColorStop(0,'rgba(255,255,255,'+s.l+')');g.addColorStop(1,'rgba(255,255,255,0)');
    cx.strokeStyle=g;cx.lineWidth=2;cx.beginPath();cx.moveTo(s.x,s.y);cx.lineTo(s.x-s.vx*9,s.y-s.vy*9);cx.stroke();return true});
  requestAnimationFrame(frame)}
requestAnimationFrame(frame);

/* ---- animated bunny mascot (SVG) ---- */
var EXP={0:['happy','love','shy','cheer'],1:['cheer','think','happy','love'],2:['think','sleepy','happy','love'],3:['happy','cheer','love'],4:['love','happy','shy'],5:['cheer','love','happy'],6:['sad','cry','sad']},fi=0;
/* แก้บั๊ก: <g> นอกจัดตำแหน่ง/ขนาด, path ในเป็นตัว animate (กัน CSS transform ทับ attribute) */
function hrt(x,y,k,f,c){return '<g transform="translate('+x+' '+y+') scale('+k+')"><path class="'+(c||'')+'" d="M0 -3C-2 -8-9 -6-9 0C-9 5-3 8 0 11C3 8 9 5 9 0C9 -6 2 -8 0 -3Z" fill="'+f+'"/></g>'}
function bunny(e,o){o=o||{};var K='#5a1f3d',L='stroke="'+K+'" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"';
  var ear=function(x,c){return '<g class="ear '+c+'"><ellipse cx="'+x+'" cy="26" rx="11" ry="24" fill="#fff" '+L+'/><ellipse cx="'+x+'" cy="28" rx="5" ry="14" fill="#ffb3cf"/></g>'};
  var dot=function(x,y,r){return '<circle class="eye" cx="'+x+'" cy="'+y+'" r="'+(r||3.8)+'" fill="'+K+'"/>'};
  var arc=function(x,d){return '<path class="eye" d="M'+x+' 58 q6 '+d+' 12 0" fill="none" '+L+'/>'};
  var star=function(x,y){return '<g transform="translate('+x+' '+y+')"><path class="spk" d="M0 -8l2.5 5.5 5.5 2.5-5.5 2.5L0 8l-2.5-5.5L-8 0l5.5-2.5z" fill="#ffd23f"/></g>'};
  var tear=function(x,c){return '<ellipse class="tear '+c+'" cx="'+x+'" cy="63" rx="2.6" ry="4" fill="#7cc7ff"/>'};
  var ey,mo,ex='',cheek=.75;
  if(e==='love'){ey=hrt(46,57,1.1,'#ff2d6f','hb')+hrt(74,57,1.1,'#ff2d6f','hb');mo='<path d="M54 68q6 8 12 0z" fill="#d6246e" '+L+'/>';ex=hrt(100,36,.9,'#ff8fb8','hb')+hrt(18,46,.7,'#ff8fb8','hb')}
  else if(e==='shy'){ey=dot(46,58,3)+dot(74,58,3);mo='<path d="M54 69q3-3 6 0t6 0" fill="none" '+L+'/>';cheek=1;ex='<path d="M31 62l3 6M36 62l3 6M81 62l3 6M86 62l3 6" '+L+' stroke="#ff5a8f" stroke-width="1.8"/>'}
  else if(e==='cheer'){ey=arc(40,-9)+arc(68,-9);mo='<path d="M52 66q8 15 16 0z" fill="#d6246e" '+L+'/><ellipse cx="60" cy="72" rx="4" ry="2.5" fill="#ff8fb8"/>';ex=star(14,30)+star(106,40)+star(100,12)}
  else if(e==='think'){ey=dot(47,55)+dot(75,55);mo='<circle cx="60" cy="70" r="3" fill="none" '+L+'/>';ex='<text class="spk" x="92" y="30" font-size="20" font-weight="700" fill="#ffd23f">?</text>'}
  else if(e==='sleepy'){ey='<path d="M40 58h12M68 58h12" fill="none" '+L+'/>';mo='<circle cx="60" cy="70" r="2.5" fill="'+K+'"/>';ex='<text class="zz" x="88" y="34" font-size="16" font-weight="700" fill="#cfe3ff">z</text><text class="zz" x="100" y="20" font-size="12" font-weight="700" fill="#cfe3ff" style="animation-delay:.4s">z</text>'}
  else if(e==='sad'){ey=dot(46,58)+dot(74,58)+'<path d="M38 49l14 4M82 49l-14 4" fill="none" '+L+'/>';mo='<path d="M54 73q6-7 12 0" fill="none" '+L+'/>';ex=tear(74,'');cheek=.4}
  else if(e==='cry'){ey=arc(40,6)+arc(68,6);mo='<path d="M53 74q7-10 14 0z" fill="#d6246e" '+L+'/>';ex=tear(46,'')+tear(74,'b');cheek=.4}
  else{ey=arc(40,-8)+arc(68,-8);mo='<path d="M54 67q6 7 12 0" fill="none" '+L+'/>'}
  var chick=o.chick?'<g class="chick"><circle cx="101" cy="100" r="13" fill="#ffd23f" '+L+'/><circle cx="97" cy="97" r="1.8" fill="'+K+'"/><circle cx="105" cy="97" r="1.8" fill="'+K+'"/><path d="M99 102l2 3 2-3z" fill="#ff8a3d"/></g>':'';
  var prop=o.heart?hrt(60,96,2.6,'#ff2d6f','hb'):'';
  return '<svg class="bun" viewBox="0 0 120 124" aria-hidden="true">'+ear(42,'l')+ear(78,'r')+

   '<ellipse class="arm" cx="30" cy="92" rx="6" ry="10" fill="#fff" '+L+'/><ellipse class="arm r" cx="90" cy="92" rx="6" ry="10" fill="#fff" '+L+'/>'+
   '<ellipse cx="60" cy="62" rx="37" ry="30" fill="#fff" '+L+'/>'+
   '<ellipse class="cheek" cx="35" cy="68" rx="7.5" ry="4.5" fill="#ff8fb2" opacity="'+cheek+'"/><ellipse class="cheek" cx="85" cy="68" rx="7.5" ry="4.5" fill="#ff8fb2" opacity="'+cheek+'"/>'+
   ey+mo+ex+chick+'</svg>'}
